<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renta Ya · Iniciar sesión</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <div class="screen">

        <div class="brand">
            <span class="brand-mark">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5L12 3Z" stroke="#ffb648" stroke-width="1.6"
                        stroke-linejoin="round" />
                </svg>
                Renta Ya
            </span>
            <svg class="brand-underline" height="6" viewBox="0 0 96 6" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 4c14-4 30 3 46 0s30-4 46 0" stroke="#ffb648" stroke-width="2" fill="none"
                    stroke-linecap="round" />
            </svg>
        </div>

        <!-- El envío se gestiona desde login.js. Aquí solo se define la estructura y los -->
        <!-- data-attributes / ids que ese script necesita para leer los campos y guardar en localStorage. -->
        <form id="login-form" novalidate>

            <h1>Iniciar sesión</h1>

            <div id="form-status" class="form-status" role="alert"></div>

            <div class="field">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" autocomplete="username"
                    required>
                <span class="field-error" id="correo-error">Ingresa un correo válido.</span>
            </div>

            <div class="field">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="••••••••"
                    autocomplete="current-password" minlength="6" required>
                <span class="field-error" id="contrasena-error">Mínimo 6 caracteres.</span>
            </div>

            <div class="row-end">
                <a href="#" id="forgot-password-link">¿Olvidaste la clave?</a>
            </div>

            <button type="submit" class="submit" id="submit-btn">Entrar</button>

            <div class="divider">o continúa con...</div>

            <div class="social-row">
                <button type="button" class="social-btn" id="social-google" aria-label="Continuar con Google">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#EA4335"
                            d="M12 10.2v3.9h5.5c-.24 1.3-1.65 3.8-5.5 3.8-3.31 0-6-2.74-6-6.1s2.69-6.1 6-6.1c1.88 0 3.14.8 3.86 1.49l2.63-2.53C16.9 3.05 14.68 2 12 2 6.98 2 3 5.98 3 11s3.98 9 9 9c5.19 0 8.63-3.64 8.63-8.77 0-.59-.06-1.04-.14-1.49H12Z" />
                    </svg>
                </button>
                <button type="button" class="social-btn" id="social-facebook" aria-label="Continuar con Facebook">
                    <svg width="16" height="16" viewBox="0 0 24 24">
                        <path fill="#1877F2"
                            d="M22 12.06C22 6.51 17.52 2 12 2S2 6.51 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.78-1.63 1.57v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94Z" />
                    </svg>
                </button>
                <button type="button" class="social-btn" id="social-apple" aria-label="Continuar con Apple">
                    <svg width="16" height="16" viewBox="0 0 24 24">
                        <path fill="#f2eee6"
                            d="M16.36 1.43c.1 1.1-.32 2.16-.94 2.94-.65.8-1.7 1.44-2.72 1.35-.12-1.06.38-2.17 1-2.9.68-.8 1.83-1.4 2.66-1.39ZM20.5 17.06c-.5 1.16-1.1 2.29-2.06 3.36-.85.95-1.83 1.9-3.14 1.92-1.26.02-1.68-.78-3.13-.78-1.46 0-1.92.76-3.11.8-1.31.05-2.3-1.03-3.16-1.97-1.75-1.93-3.09-5.46-1.29-7.87.9-1.2 2.42-1.96 4.05-1.98 1.28-.02 2.4.85 3.16.85.74 0 2.11-1.05 3.55-.9.61.03 2.31.25 3.4 1.85-.09.05-2.03 1.19-2.01 3.54.02 2.8 2.45 3.73 2.74 3.85Z" />
                    </svg>
                </button>
            </div>

            <p class="signup-hint">¿No tienes cuenta? <a href="../views/registro.html">Regístrate</a></p>

        </form>
    </div>

    <script src="../js/login.js"></script>
</body>

</html>
