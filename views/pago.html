<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renta Ya · Confirmar reserva</title>
<link rel="stylesheet" href="../css/styleBase.css">
<link rel="stylesheet" href="../css/pago.css">
</head>
<body>
<div class="app">

  <div class="back-row">
    <a href="detalle-propiedad.html" class="icon-btn" aria-label="Volver">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1>Confirmar reserva</h1>
  </div>

  <!-- js/pago.js valida el método seleccionado, calcula/lee el total desde -->
  <!-- localStorage (p. ej. "rentaya_reserva") y procesa la confirmación. -->
  <form class="page payment-page no-nav" id="pago-form">

    <div class="card booking-summary">
      <div class="thumb">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20" stroke="currentColor" stroke-width="1.3"/></svg>
      </div>
      <div class="dates">
        <div class="lines"></div>
        <div class="range">1 ago – 1 sep</div>
      </div>
    </div>

    <div class="cost-breakdown">
      <div class="cost-row">
        <span>Arriendo</span>
        <span>$2.1M</span>
      </div>
      <div class="cost-row">
        <span>Depósito</span>
        <span>$2.1M</span>
      </div>
      <div class="cost-row">
        <span>Comisión</span>
        <span>$63K</span>
      </div>
      <div class="cost-row total">
        <span>Total</span>
        <span class="amount">$4.26M</span>
      </div>
    </div>

    <div class="section-label" style="font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); margin: 22px 0 10px;">Método de pago</div>

    <label class="payment-method selected">
      <input type="radio" name="metodo-pago" value="tarjeta" checked>
      Tarjeta de crédito
    </label>

    <label class="payment-method">
      <input type="radio" name="metodo-pago" value="pse">
      PSE
    </label>

    <button type="submit" class="btn-primary mt-24" id="confirmar-pago-btn">Confirmar pago</button>

    <p class="confirm-note">Depósito retenido hasta la entrega</p>

  </form>

</div>
<script src="../js/pago.js"></script>
</body>
</html>
