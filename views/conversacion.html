<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renta Ya · Conversación</title>
<link rel="stylesheet" href="../css/styleBase.css">
<link rel="stylesheet" href="../css/conversacion.css">
</head>
<body>
<div class="app">
  <div class="chat-page">

    <div class="chat-header">
      <a href="mensajes.html" class="icon-btn" aria-label="Volver" style="width:32px;height:32px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <span class="avatar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c1.2-3.6 4.2-6 7.5-6s6.3 2.4 7.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      <span class="contact-name">Camila R.</span>
    </div>

    <!-- js/conversacion.js puede renderizar aquí el historial leyendo de localStorage -->
    <!-- (p. ej. "rentaya_chat_<id>") y agregar burbujas .bubble-row.in / .bubble-row.out. -->
    <div class="chat-body" id="chat-mensajes">

      <div class="bubble-row in">
        <div class="bubble"><div class="bubble-lines"></div></div>
      </div>

      <div class="bubble-row out">
        <div class="bubble" style="max-width:60%;"><div class="bubble-lines"></div></div>
      </div>

      <div class="bubble-row in">
        <a href="detalle-propiedad.html" class="bubble-listing" style="text-decoration:none; color:inherit;">
          <span class="thumb">
            <svg width="16" height="16" viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20" stroke="currentColor" stroke-width="1.3"/></svg>
          </span>
          <span class="info">
            <div class="name">Apto El Poblado</div>
            <div class="price">$2.1M/mes</div>
          </span>
        </a>
      </div>

      <div class="bubble-row out">
        <div class="bubble"><div class="bubble-lines"></div></div>
      </div>

    </div>

    <form class="chat-input-row" id="chat-form">
      <button type="button" class="chat-icon-btn" id="btn-adjuntar" aria-label="Adjuntar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <input type="text" id="mensaje-input" placeholder="Escribe un mensaje..." autocomplete="off">
      <button type="submit" class="chat-icon-btn send" id="btn-enviar" aria-label="Enviar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 12l16-7-6 16-2.5-6.5L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </form>

  </div>
</div>
<script src="../js/conversacion.js"></script>
</body>
</html>
