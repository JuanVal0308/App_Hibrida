<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renta Ya · Buscar</title>
<link rel="stylesheet" href="../css/styleBase.css">
<link rel="stylesheet" href="../css/buscar.css">
</head>
<body>
<div class="app">

  <div class="search-page">

    <div class="search-bar">
      <div class="field">
        <span class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <input type="search" id="buscar-barrio" placeholder="Buscar barrio...">
      </div>
      <button type="button" class="icon-btn" id="btn-menu" aria-label="Menú">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="chip-group" id="tipo-chips">
      <span class="chip active" data-tipo="apto">Aptos</span>
      <span class="chip" data-tipo="casa">Casas</span>
      <span class="chip" data-tipo="celda">Celdas</span>
    </div>

    <!-- Mapa de marcador estático (ilustrativo). js/buscar.js puede escuchar -->
    <!-- clic en .pin para mostrar el preview correspondiente en .preview-sheet. -->
    <div class="map-area" id="map-area">
      <div class="map-grid"></div>
      <span class="map-label">✕ mapa Medellín ✕</span>
      <button class="pin pin-1" aria-label="Propiedad en el mapa" data-listing="1">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.58 7-12.5A7 7 0 1 0 5 9.5C5 14.42 12 22 12 22Z" fill="currentColor"/><circle cx="12" cy="9.5" r="2.5" fill="#10151b"/></svg>
      </button>
      <button class="pin pin-2" aria-label="Propiedad en el mapa" data-listing="2">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.58 7-12.5A7 7 0 1 0 5 9.5C5 14.42 12 22 12 22Z" fill="currentColor"/><circle cx="12" cy="9.5" r="2.5" fill="#10151b"/></svg>
      </button>
      <button class="pin pin-3" aria-label="Propiedad en el mapa" data-listing="3">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.58 7-12.5A7 7 0 1 0 5 9.5C5 14.42 12 22 12 22Z" fill="currentColor"/><circle cx="12" cy="9.5" r="2.5" fill="#10151b"/></svg>
      </button>
    </div>

    <a href="detalle-propiedad.html" class="preview-sheet">
      <div class="sheet-handle"></div>
      <div class="preview-card">
        <div class="preview-thumb">
          <svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20" stroke="currentColor" stroke-width="1.4"/></svg>
        </div>
        <div class="preview-lines">
          <div class="listing-lines mb-0"></div>
        </div>
        <div class="preview-price">$/mes</div>
      </div>
    </a>

  </div>

  <nav class="bottom-nav">
    <a href="buscar.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Buscar
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.5-4.6-10-9.3C.5 8 2.4 4.5 6 4.5c2 0 3.6 1.1 4.5 2.5C11.4 5.6 13 4.5 15 4.5c3.6 0 5.5 3.5 4 7.2C19.5 16.4 12 21 12 21Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      Favoritos
    </a>
    <a href="mensajes.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      Chat
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M4.5 20c1.2-3.6 4.2-6 7.5-6s6.3 2.4 7.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Perfil
    </a>
  </nav>

</div>
<script src="../js/buscar.js"></script>
</body>
</html>
