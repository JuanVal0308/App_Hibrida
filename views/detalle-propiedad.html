<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renta Ya · Detalle de la propiedad</title>
<link rel="stylesheet" href="../css/styleBase.css">
<link rel="stylesheet" href="../css/detalle-propiedad.css">
</head>
<body>
<div class="app">
  <div class="detail-page">

    <div class="detail-hero">
      <div class="hero-top-actions">
        <a href="resultados.html" class="hero-btn" aria-label="Volver">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <!-- js/detalle-propiedad.js puede alternar la clase "saved" y guardar el id -->
        <!-- de esta propiedad en localStorage (p. ej. "rentaya_favoritos"). -->
        <button class="hero-btn saved" id="btn-guardar" aria-label="Guardar propiedad">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 3h12v18l-6-4-6 4V3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <svg width="52" height="52" viewBox="0 0 24 24" style="opacity:.3;"><path d="M4 4l16 16M20 4L4 20" stroke="#93a0af" stroke-width="1.2"/></svg>
    </div>

    <div class="detail-body">

      <div class="detail-title-row">
        <span class="detail-title">Apto El Poblado</span>
        <span class="detail-price">$2.1M</span>
      </div>
      <p class="small muted" style="margin:0;">El Poblado, Medellín</p>

      <div class="tags-row">
        <span class="tag">2 hab</span>
        <span class="tag">2 baños</span>
        <span class="tag">68 m²</span>
      </div>

      <div class="amenities-row">
        <span class="amenity">Parqueadero</span>
        <span class="amenity">Gimnasio</span>
      </div>

      <div class="map-box" id="ver-mapa">✕ Ver mapa ✕</div>

      <div class="landlord-row">
        <span class="avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c1.2-3.6 4.2-6 7.5-6s6.3 2.4 7.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <div>
          <div class="small">Arrendador</div>
          <div class="stars">★★★★☆</div>
        </div>
      </div>

    </div>

    <div class="detail-footer">
      <span class="price-big">$2.1M/mes</span>
      <a href="conversacion.html" class="btn-primary" style="text-decoration:none;">Contactar</a>
    </div>

  </div>
</div>
<script src="../js/detalle-propiedad.js"></script>
</body>
</html>
