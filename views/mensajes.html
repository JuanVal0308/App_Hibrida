<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renta Ya · Mensajes</title>
<link rel="stylesheet" href="../css/styleBase.css">
<link rel="stylesheet" href="../css/mensajes.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <span class="brand-mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5L12 3Z" stroke="#ffb648" stroke-width="1.6" stroke-linejoin="round"/></svg>
      Renta Ya
    </span>
  </div>

  <div class="messages-page">
    <h1 class="title">Mensajes</h1>

    <div class="field messages-search">
      <span class="search-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <input type="search" id="buscar-conversacion" placeholder="Buscar conversación...">
    </div>
  </div>

  <!-- js/mensajes.js puede renderizar esta lista leyendo de localStorage -->
  <!-- (p. ej. "rentaya_conversaciones"), reusando .conversation-row por cada chat. -->
  <div class="page" id="conversaciones-lista" style="padding-top:8px;">
    <div class="conversation-list">

      <a href="conversacion.html" class="conversation-row">
        <span class="avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c1.2-3.6 4.2-6 7.5-6s6.3 2.4 7.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <div class="conversation-info">
          <div class="conversation-preview"></div>
        </div>
        <div class="conversation-meta">
          <span class="conversation-time">2m</span>
          <span class="unread-dot"></span>
        </div>
      </a>

      <a href="conversacion.html" class="conversation-row">
        <span class="avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c1.2-3.6 4.2-6 7.5-6s6.3 2.4 7.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <div class="conversation-info">
          <div class="conversation-preview"></div>
        </div>
        <div class="conversation-meta">
          <span class="conversation-time">1h</span>
          <span class="unread-dot"></span>
        </div>
      </a>

      <a href="conversacion.html" class="conversation-row">
        <span class="avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c1.2-3.6 4.2-6 7.5-6s6.3 2.4 7.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <div class="conversation-info">
          <div class="conversation-preview"></div>
        </div>
        <div class="conversation-meta">
          <span class="conversation-time">3h</span>
        </div>
      </a>

      <a href="conversacion.html" class="conversation-row">
        <span class="avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c1.2-3.6 4.2-6 7.5-6s6.3 2.4 7.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <div class="conversation-info">
          <div class="conversation-preview"></div>
        </div>
        <div class="conversation-meta">
          <span class="conversation-time">1d</span>
        </div>
      </a>

    </div>
  </div>

  <nav class="bottom-nav">
    <a href="buscar.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Buscar
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.5-4.6-10-9.3C.5 8 2.4 4.5 6 4.5c2 0 3.6 1.1 4.5 2.5C11.4 5.6 13 4.5 15 4.5c3.6 0 5.5 3.5 4 7.2C19.5 16.4 12 21 12 21Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      Favoritos
    </a>
    <a href="mensajes.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      Chat
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M4.5 20c1.2-3.6 4.2-6 7.5-6s6.3 2.4 7.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Perfil
    </a>
  </nav>

</div>
<script src="../js/mensajes.js"></script>
</body>
</html>
